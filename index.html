<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wifey: The Headpattening</title>
    <script src="/tailwind.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              pastelPink: '#ffd1dc',
              pastelBlue: '#bde0fe',
              pastelGreen: '#d4edda',
              pastelYellow: '#fff3cd'
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        background-color: #fff0f5; /* Lavender blush / pastel pink-ish */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }
      
      /* Scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #f48fb1; /* darker pastel pink */
        border-radius: 4px;
      }
    </style>
  </head>

    <div id="root"></div>
