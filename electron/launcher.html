<!DOCTYPE html>
<html>
<head>
  <title>Wifey: The Headpattening - Connect</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #1f2937; color: white; margin: 0; }
    .box { background: #374151; padding: 30px; border-radius: 10px; text-align: center; border: 2px solid #ec4899; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    input { padding: 10px; font-size: 16px; width: 300px; margin-bottom: 20px; border-radius: 5px; border: none; }
    button { padding: 10px 20px; font-size: 16px; background: #ec4899; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #db2777; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Connect to Game Server</h2>
    <div id="error-msg" style="display:none; color: #fca5a5; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; font-size: 13px;"></div>
    <p>Enter the LAN IP address of the host.</p>
    <input type="text" id="ip" value="http://localhost:3000" onkeydown="if(event.key === 'Enter') connect()" />
    <br>
    <button onclick="connect()">Connect</button>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const serverParam = urlParams.get('server');
    const errorParam = urlParams.get('error');
    const saved = localStorage.getItem('server-ip');
    
    if (errorParam) {
      const errEl = document.getElementById('error-msg');
      errEl.textContent = 'Connection failed: ' + errorParam + '. Is the server running?';
      errEl.style.display = 'block';
    }
    
    if (serverParam) {
      document.getElementById('ip').value = serverParam;
    } else if (saved) {
      document.getElementById('ip').value = saved;
    }

    function connect() {
      let ip = document.getElementById('ip').value.trim();
      if (!ip.startsWith('http://') && !ip.startsWith('https://')) {
        ip = 'http://' + ip;
      }
      try {
        const parsed = new URL(ip);
        if (!parsed.port) {
          parsed.port = '3000';
          ip = parsed.toString().replace(/\/$/, '');
        }
      } catch(e) {}
      localStorage.setItem('server-ip', ip);
      if (ip.includes('?')) {
        window.location.href = ip + '&electron=true';
      } else {
        window.location.href = ip + '?electron=true';
      }
    }
  </script>
</body>
</html>
